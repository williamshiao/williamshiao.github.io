<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ditto.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="William Shiao — software engineer and aspiring UI/UX engineer. Portfolio featuring artworks and internship experience." />
    <title>William Shiao — Portfolio</title>
    <script>
      // Applies a saved night-mode preference before first paint so
      // returning visitors don't see a flash of the light theme — the
      // switch shape (see FloatingShapes' toggleNightMode) is the only
      // thing that ever sets this key.
      try {
        if (localStorage.getItem("ditto-night-mode") === "true") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
